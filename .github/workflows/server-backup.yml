# Nightly copy of the server's STRUCTURE (tables, functions, rules, scheduled
# jobs and settings) into this repo, so a new Supabase project can be rebuilt
# if anything happens. No member data is copied: no accounts, posts, homes,
# addresses or home codes. Member data is protected by Supabase's own daily
# backups (Pro plan).
#
# Needs one repository secret, SUPABASE_DB_URL: Supabase dashboard > Connect >
# "Session pooler" connection string, with the database password filled in.
# Never paste it anywhere else.
name: Server backup

on:
  schedule:
    - cron: "17 8 * * *"   # every night, 3:17 AM Eastern (EST)
  workflow_dispatch:        # Actions > Server backup > Run workflow

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Tables, functions and rules (no data)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p supabase/backup
          supabase db dump --db-url "$SUPABASE_DB_URL" -f supabase/backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" --schema private -f supabase/backup/schema_private.sql

      - name: Scheduled jobs, settings and change history
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -c \
            "copy (select jobname, schedule, command from cron.job order by jobname) to stdout with csv header" \
            > supabase/backup/cron_jobs.csv
          # Settings, leaving out anything that looks like a code or a key.
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -c \
            "copy (select key, value from private.app_settings where key !~* '(code|key|secret|password|token)' order by key) to stdout with csv header" \
            > supabase/backup/app_settings.csv
          # Every change applied to the server, in order (name + SQL).
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -c \
            "copy (select version, name, array_to_string(statements, E'\n;\n') from supabase_migrations.schema_migrations order by version) to stdout with csv header" \
            > supabase/backup/migrations.csv

      - name: Save if anything changed
        run: |
          git config user.name "CulDeChat backup"
          git config user.email "support@culdechat.app"
          git add supabase/backup
          if git diff --cached --quiet; then
            echo "No changes since the last backup."
          else
            git commit -m "Server backup $(date -u +%Y-%m-%d)"
            git push
          fi
